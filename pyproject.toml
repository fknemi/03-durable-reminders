[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durable-reminders"
version = "0.1.0"
description = "Durable reminders and scheduled follow-ups service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
durable-reminders = "durable_reminders.main:cli"
durable-reminders-benchmark = "benchmark.run_benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_reminders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
