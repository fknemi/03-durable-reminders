version: '3.8'

services:
  reminders-api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/reminders.db
      - WORKER_ENABLED=true  
      - LOG_LEVEL=INFO
    command: uvicorn src.durable_reminders.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
