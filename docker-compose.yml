version: '3.8'

services:
  reminders-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - REMINDERS_DB=/app/data/reminders.db
      - REMINDERS_CLOCK=system
      - REMINDERS_WORKER_INTERVAL=1.0
    command: uvicorn durable_reminders.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
